services:
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22
    container_name: '${APP_NAME}.io'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      # Use :cached flag to speed up cache: https://github.com/docker/for-mac/issues/1592
      - '.:/var/www/html:cached'
    depends_on:
      - mariadb
      - elasticsearch

    # environment:
    #   WEB_DOCUMENT_ROOT: /app/public
    #   MYSQL_DATABASE: su_myapp
    #   MYSQL_USER: root # TODO
    #   MYSQL_PASSWORD: ChangeMe

  mariadb:
    image: 'mariadb:11'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'werkenbijbluekens-mariadb-data:/var/lib/mysql'

  elasticsearch:
    image: 'elasticsearch:7.17.27'
    container_name: elasticsearch_${APP_NAME}
    environment:
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      discovery.type: 'single-node'
    ports:
      - '${FORWARD_ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - 'werkenbijbluekens-elasticsearch-data:/usr/share/elasticsearch/data'


networks:
  ${APP_NAME}:
    driver: bridge
volumes:
  werkenbijbluekens-mariadb-data:
    driver: local
  werkenbijbluekens-elasticsearch-data:
    driver: local
